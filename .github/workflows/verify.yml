name: API authentication checks
on:
  push:
    branches: [main, feature/reliable-chat, feature/message-delete, feature/message-edit, feature/client-profile-campaign, feature/unified-auth, feature/role-access, feature/support-queue, fix/client-edit-profile]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: [27017:27017]
    env:
      RUN_MONGO_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test without production services
        run: mvn -B '-Dtest=*Test,!WtcSyncApplicationTests' test
      - name: Package
        run: mvn -B -DskipTests package
  verify-deployment:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Render and check public authentication routes
        run: python3 scripts/verify_auth_deployment.py
